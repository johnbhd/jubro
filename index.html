<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jubro || Your simple Job Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/global.css" />
  <link rel="icon" type="image/png" href="./img/jubro.png" />
</head>
<body id="appBody" class="bg-gray-100 text-gray-800 flex justify-center">
  <div class="w-full max-w-6xl px-3 lg:px-0">
    <header class="flex items-center justify-between p-4 bg-white shadow-sm sticky top-0 z-10 rounded-md">
      <div class="flex items-center gap-3">
        <a href="./pages/homepage.html" class="text-gray-600">←</a>
        <input type="text"  class="text-lg font-semibold bg-transparent border-b border-transparent focus:border-gray-300 outline-none" />
      </div>
      <div class="relative">
        <button id="btnDashboard" type="button" class="px-4 py-2 bg-black text-white rounded-lg hover:bg-gray-800">
          Dashboard
        </button>
        <button id="btnMenu" type="button" class="p-2 rounded-lg hover:bg-gray-100 text-xl">
          ⋯
        </button>
      
        <!-- DROPDOWN -->
        <div id="navDropdown" class="hidden absolute right-0 mt-1 w-40 bg-white border rounded-md shadow text-sm overflow-hidden">
          <button id="btnImport" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
            Import JSON
          </button>
          <button id="btnExport" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
            Export JSON
          </button>
        </div>
      </div>
    </header>
    
    <main class="py-4" id="tableContainer">
      <div class="bg-white rounded-md shadow overflow-x-auto">
        <table class="min-w-max w-full text-sm text-center" id="table">
          <thead class="bg-gray-50 sticky top-0">
            <tr id="headerRow"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="dashboardModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-2xl w-full max-w-md">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold">Dashboard</h2>
        <button id="btnCloseDashboard" type="button" class="text-gray-500 text-xl hover:text-black">
          &times;
        </button>
      </div>

      <div class="space-y-3">
        <div class="flex justify-between items-center border rounded-xl p-3">
          <span class="text-gray-600">Applied</span>
          <span id="dashboardApplied" class="font-semibold text-blue-500">0</span>
        </div>
        <div class="flex justify-between items-center border rounded-xl p-3">
          <span class="text-gray-600">Interview</span>
          <span id="dashboardInterview" class="font-semibold text-green-500">0</span>
        </div>
        <div class="flex justify-between items-center border rounded-xl p-3">
          <span class="text-gray-600">Rejected</span>
          <span id="dashboardRejected" class="font-semibold text-red-500">0</span>
        </div>
      </div>
    </div>
  </div>
  
  <div id="contextMenu" class="hidden fixed z-50 bg-white border rounded-lg shadow w-48 text-sm">
    <div class="relative group">
      <button id="btn-customize" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
        Customize ▶
      </button>
    
      <!-- SUBMENU -->
      <div id="subMenu"
        class="hidden absolute left-full top-0 ml-1 w-40 bg-white border rounded-md shadow text-sm overflow-hidden">
        
        <button id="btn-type-text" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Text
        </button>
        <button id="btn-type-checkbox" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Checkbox
        </button>
        <button id="btn-type-date" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Date
        </button>
        <button id="btn-type-select" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Select
        </button>
    
      </div>
    </div>
    <button id="btn-addRow" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Add Row</button>
    <button id="btn-addCol" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Add Column</button>
    <button id="btn-copyRow" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
      Copy Row
    </button>
    
    <button id="btn-copyCol" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
      Copy Column
    </button>
    <button id="btn-moveUp" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Up</button>
    <button id="btn-moveDown" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Down</button>
    <button id="btn-moveLeft" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Left</button>
    <button id="btn-moveRight" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Right</button>
    <button id="btn-delRow" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100 text-red-500">Delete Row</button>
    <button id="btn-delCol" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100 text-red-500">Delete Column</button>
  </div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
