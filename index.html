<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jubro || Your simple Job Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="./img/jubro.png" />
</head>
<body id="appBody" class="bg-gray-100 text-gray-800 flex justify-center">
  <div class="w-full max-w-6xl">
    <header class="flex items-center justify-between p-4 bg-white shadow-sm sticky top-0 z-10 rounded-b-2xl">
      <div class="flex items-center gap-3">
        <a href="./pages/homepage.html" class="text-gray-600">←</a>
        <input type="text"  class="text-lg font-semibold bg-transparent border-b border-transparent focus:border-gray-300 outline-none" />
      </div>
      <div class="relative">
        <button id="btnMenu" class="p-2 rounded-lg hover:bg-gray-100 text-xl">
          ⋯
        </button>
      
        <!-- DROPDOWN -->
        <div id="navDropdown" class="hidden absolute right-0 mt-1 w-40 bg-white border rounded-md shadow text-sm overflow-hidden">
          <button id="btnImport" class="w-full text-left px-4 py-2 hover:bg-gray-100">
            Import CSV
          </button>
          <button id="btnExport" class="w-full text-left px-4 py-2 hover:bg-gray-100">
            Export CSV
          </button>
        </div>
      </div>
    </header>
    
    <main class="p-4" id="tableContainer">
      <div class="bg-white rounded-2xl shadow overflow-x-auto">
        <table class="min-w-full text-sm text-center" id="table">
          <thead class="bg-gray-50 sticky top-0">
            <tr id="headerRow"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </main>
  </div>
  
  <div id="contextMenu" class="hidden fixed z-50 bg-white border rounded-lg shadow w-48 text-sm">
    <div class="relative group">
      <button id="btn-customize" class="w-full text-left px-4 py-2 hover:bg-gray-100">
        Customize ▶
      </button>
    
      <!-- SUBMENU -->
      <div id="subMenu"
        class="hidden absolute left-full top-0 ml-1 w-40 bg-white border rounded-md shadow text-sm overflow-hidden">
        
        <button id="btn-type-text" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Text
        </button>
        <button id="btn-type-checkbox" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Checkbox
        </button>
        <button id="btn-type-date" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Date
        </button>
        <button id="btn-type-select" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Select
        </button>
    
      </div>
    </div>
    <button id="btn-addRow" class="w-full text-left px-4 py-2 hover:bg-gray-100">Add Row</button>
    <button id="btn-addCol" class="w-full text-left px-4 py-2 hover:bg-gray-100">Add Column</button>
    <button id="btn-copyRow" class="w-full text-left px-4 py-2 hover:bg-gray-100">
      Copy Row
    </button>
    
    <button id="btn-copyCol" class="w-full text-left px-4 py-2 hover:bg-gray-100">
      Copy Column
    </button>
    <button id="btn-moveUp" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Up</button>
    <button id="btn-moveDown" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Down</button>
    <button id="btn-moveLeft" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Left</button>
    <button id="btn-moveRight" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Right</button>
    <button id="btn-delRow" class="w-full text-left px-4 py-2 hover:bg-gray-100 text-red-500">Delete Row</button>
    <button id="btn-delCol" class="w-full text-left px-4 py-2 hover:bg-gray-100 text-red-500">Delete Column</button>
  </div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
