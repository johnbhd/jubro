<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (() => {
      const themeKey = 'jubro_theme';
      let theme = 'dark';

      try {
        const savedTheme = localStorage.getItem(themeKey);
        theme = savedTheme === 'light' ? 'light' : 'dark';

        if (!savedTheme) {
          localStorage.setItem(themeKey, theme);
        }
      } catch (error) {
        theme = 'dark';
      }

      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Job Applications - Jubro Tracker Dashboard</title>
  <meta
    name="description"
    content="Create job application trackers in Jubro to organize companies, roles, statuses, dates, links, interviews, and job search progress in one dashboard."
  />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://jubro.vercel.app/trackers" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Jubro" />
  <meta property="og:title" content="Track Job Applications - Jubro Tracker Dashboard" />
  <meta
    property="og:description"
    content="Build simple job trackers for applications, interviews, statuses, and job links with Jubro."
  />
  <meta property="og:url" content="https://jubro.vercel.app/trackers" />
  <meta property="og:image" content="https://jubro.vercel.app/img/jubro.png" />
  <meta property="og:image:alt" content="Jubro job tracker dashboard logo" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Track Job Applications - Jubro Tracker Dashboard" />
  <meta
    name="twitter:description"
    content="Create clean trackers for your job applications, statuses, dates, and links."
  />
  <meta name="twitter:image" content="https://jubro.vercel.app/img/jubro.png" />
  <meta name="twitter:image:alt" content="Jubro job tracker dashboard logo" />

  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="icon" type="image/png" href="/img/jubro.png" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }

    @media (min-width: 1024px) {
      #mobileTrackerMenu.hidden {
        display: contents !important;
      }
    }
  </style>
</head>

<body id="homeBody" data-page="tracker" class="bg-gray-100 min-h-screen">

  <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-10 py-8 sm:py-10">

    <div id="navbar"></div>

    <header class="mb-8">
      <h1 class="text-3xl font-black text-gray-900 sm:text-4xl">
        Job Application Trackers
      </h1>

      <p class="mt-3 max-w-2xl text-gray-600">
        Create and open trackers for applications, interviews, status, dates, and job links.
      </p>
    </header>
 
    <div id="trackerGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6"></div>

  </div>

  <!-- MODAL -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-2xl w-full max-w-md">

      <form id="trackerForm">
        <h2 class="text-xl font-semibold mb-4">Create Tracker</h2>
        <p id="titleError" class="text-red-500 text-sm mb-2 hidden"></p>
        
        <input
          id="titleInput"
          class="w-full border p-3 rounded-xl mb-4 outline-none focus:ring-2 focus:ring-black"
          placeholder="Tracker name"
        />
        <div class="flex gap-2">
          <button id="btnCancel" type="button" class="flex-1 py-2 bg-gray-200 rounded-xl">
            Cancel
          </button>

          <button id="btnCreate" type="submit" class="theme-create-button flex-1 py-2 bg-black text-white rounded-xl">
            Create
          </button>
        </div>
      </form>

    </div>
  </div>
   <!-- DELETE MODAL -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-2xl w-full max-w-md scale-95 animate-[fadeIn_.2s_ease-out_forwards]">
      <h2 class="text-xl font-semibold mb-2 text-gray-800">
        Delete Tracker
      </h2>
  
      <p id="deleteText" class="text-gray-500 mb-6">
        Are you sure you want to delete this tracker?
      </p>
  
      <div class="flex gap-2">
        <button id="btnDeleteCancel" type="button" class="flex-1 py-2 bg-gray-200 rounded-xl">
          Cancel
        </button>
  
        <button id="btnDeleteConfirm" type="button" class="flex-1 py-2 bg-red-500 text-white rounded-xl hover:bg-red-600 transition">
          Delete
        </button>
      </div>
    </div>
  </div>


<script type="module" src="/js/main.js"></script>
<script type="module" src="/js/home.js"></script>
</body>
</html>
