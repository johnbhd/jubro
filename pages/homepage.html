<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jubro || Your simple Job Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="icon" type="image/png" href="../img/jubro.png" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>

<body id="homeBody" class="bg-gray-100 min-h-screen">

  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-10">

    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between mb-10">
      <div>
        <div class="flex items-center gap-3">
          <img src="../img/jubro.png" alt="Jubro logo" class="w-10 h-10 rounded-lg" />
          <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-2 md">
            Jubro
          </h1>
        </div>
        <p class="text-gray-500 mt-1">
          A simple way to track your job applications 
        </p>
      </div>
      <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
        <!-- New Tracker -->
        <button
          id="btnOpenModal"
          type="button"
          class="cursor-pointer w-full sm:w-auto px-5 py-3 bg-black text-white rounded-2xl hover:bg-gray-800 transition"
        >
          + New Tracker
        </button>
        <!-- Sign In Button -->
        <button
          id="btnSignIn"
          type="button"
          class="cursor-pointer w-full sm:w-auto px-5 py-3 border border-gray-300 rounded-2xl hover:bg-gray-100 transition"
        >
          <i class="fa-solid fa-user mr-2"></i>
          Sign In
        </button>
    
      </div>
    </div>
 
    <div id="trackerGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6"></div>

  </div>

  <!-- MODAL -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-2xl w-full max-w-md">

      <form id="trackerForm">
        <h2 class="text-xl font-semibold mb-4">Create Tracker</h2>
        <p id="titleError" class="text-red-500 text-sm mb-2 hidden"></p>
        
        <input
          id="titleInput"
          class="w-full border p-3 rounded-xl mb-4 outline-none focus:ring-2 focus:ring-black"
          placeholder="Tracker name"
        />
        <div class="flex gap-2">
          <button id="btnCancel" type="button" class="flex-1 py-2 bg-gray-200 rounded-xl">
            Cancel
          </button>

          <button id="btnCreate" type="submit" class="flex-1 py-2 bg-black text-white rounded-xl">
            Create
          </button>
        </div>
      </form>

    </div>
  </div>
   <!-- DELETE MODAL -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-2xl w-full max-w-md scale-95 animate-[fadeIn_.2s_ease-out_forwards]">
      <h2 class="text-xl font-semibold mb-2 text-gray-800">
        Delete Tracker
      </h2>
  
      <p id="deleteText" class="text-gray-500 mb-6">
        Are you sure you want to delete this tracker?
      </p>
  
      <div class="flex gap-2">
        <button id="btnDeleteCancel" type="button" class="flex-1 py-2 bg-gray-200 rounded-xl">
          Cancel
        </button>
  
        <button id="btnDeleteConfirm" type="button" class="flex-1 py-2 bg-red-500 text-white rounded-xl hover:bg-red-600 transition">
          Delete
        </button>
      </div>
    </div>
  </div>


  <!-- IMPORTANT: correct path -->

<script type="module" src="../js/home.js"></script>
</body>
</html>
