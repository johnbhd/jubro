<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (() => {
      const themeKey = 'jubro_theme';
      let theme = 'dark';

      try {
        const savedTheme = localStorage.getItem(themeKey);
        theme = savedTheme === 'light' ? 'light' : 'dark';

        if (!savedTheme) {
          localStorage.setItem(themeKey, theme);
        }
      } catch (error) {
        theme = 'dark';
      }

      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jubro Board - Job Application Workspace</title>
  <meta
    name="description"
    content="Jubro board workspace for managing a selected job application tracker."
  />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://jubro.vercel.app/board" />
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="icon" type="image/png" href="/img/jubro.png" />
</head>
<body id="appBody" class="bg-gray-100 text-gray-800 flex min-h-screen justify-center overflow-x-hidden">
  <h1 class="sr-only">Jubro Job Application Board</h1>
  <div class="w-full min-w-0 max-w-[1600px] mx-auto px-3 sm:px-6 lg:px-10">
    <header id="appNavbar" class="relative grid grid-cols-[minmax(0,1fr)_auto] items-center gap-2 p-3 bg-white shadow-sm sticky top-0 z-10 rounded-md sm:p-4 lg:grid-cols-[minmax(0,1fr)_minmax(20rem,32rem)_minmax(0,1fr)] lg:gap-4">
      <div class="flex min-w-0 items-center gap-2">
        <a href="/trackers" class="shrink-0 text-gray-600" aria-label="Back to home">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <input
          id="trackerTitleInput"
          type="text"
          class="min-w-0 flex-1 truncate text-lg font-semibold bg-transparent border-b border-transparent focus:border-gray-300 outline-none"
          aria-label="Tracker title"
        />
      </div>
      <div
        id="searchWrapper"
        class="relative hidden w-full min-w-0 gap-2 overflow-x-auto max-lg:absolute max-lg:inset-0 max-lg:z-20 max-lg:items-center max-lg:bg-white max-lg:p-3 lg:flex"
      >
        <!-- SEARCH -->
        <div
          id="searchInputWrapper"
          class="relative min-w-[12rem] flex-1"
        >
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm text-gray-400"></i>

          <input
            id="jobSearchInput"
            type="text"
            placeholder="Search applications..."
            class="h-10 w-full rounded-full bg-gray-100 py-2 pl-10 pr-11 text-sm outline-none focus:bg-gray-50"
          />
        </div>

        <!-- SORT -->
        <div class="relative shrink-0">
          <i
            class="fa-solid fa-arrow-down-wide-short pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-400"
          ></i>

          <select
            id="boardSortSelect"
            class="cursor-pointer h-10 w-[86px] appearance-none rounded-full bg-gray-100 pl-8 pr-7 text-sm text-gray-700 outline-none transition focus:bg-gray-50 sm:w-[90px]"
            aria-label="Sort applications"
          >
            <option value="date-desc">New</option>
            <option value="date-asc">Old</option>
            <option value="select-text">Select</option>
          </select>

          <i
            class="fa-solid fa-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-400"
          ></i>
        </div>

        <!-- TEXT FILTER -->
        <div id="selectTextSortWrapper" class="relative hidden shrink-0">
          <select
            id="selectTextSortSelect"
            class="cursor-pointer h-10 w-[92px] appearance-none rounded-full bg-gray-100 px-3 pr-7 text-sm text-gray-700 outline-none transition focus:bg-gray-50 sm:w-[95px]"
            aria-label="Select text column"
          ></select>

          <i
            class="fa-solid fa-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-400"
          ></i>
        </div>

        <!-- VALUE FILTER -->
        <div id="selectValueFilterWrapper" class="relative hidden shrink-0">
          <select
            id="selectValueFilterSelect"
            class="cursor-pointer h-10 w-[92px] appearance-none rounded-full bg-gray-100 px-3 pr-7 text-sm text-gray-700 outline-none transition focus:bg-gray-50 sm:w-[95px]"
            aria-label="Select option value"
          ></select>

          <i
            class="fa-solid fa-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-400"
          ></i>
        </div>

        <!-- CLOSE -->
        <button
          id="btnCloseSearch"
          type="button"
          class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200"
          aria-label="Close search"
        >
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <div class="board-toolbar-actions relative justify-self-end">
        <div class="board-toolbar-actions-row flex items-center justify-center gap-1 sm:gap-2">
          <button id="btnOpenSearch" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-lg hover:bg-gray-100 text-gray-700 lg:hidden" aria-label="Open search">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <nav id="boardViewNavigation" class="board-view-navigation inline-flex items-center rounded-lg bg-gray-100 p-1" aria-label="Workspace view">
            <button id="btnBoardView" type="button" class="board-view-button rounded-md px-2.5 py-1.5 text-xs font-medium" data-board-view-button="kanban" aria-pressed="true">
              <i class="fa-solid fa-table-columns mr-1"></i>
              Board
            </button>
            <button id="btnListView" type="button" class="board-view-button rounded-md px-2.5 py-1.5 text-xs font-medium" data-board-view-button="list" aria-pressed="false">
              <i class="fa-solid fa-list mr-1"></i>
              List
            </button>
          </nav>
          <select id="boardViewSelect" class="sr-only" aria-label="Workspace view">
            <option value="kanban">Board</option>
            <option value="list">List</option>
          </select>
          <button id="btnAddApplication" type="button" title="Add Application" class="inline-flex h-10 items-center gap-2 rounded-lg bg-black px-3 text-sm font-medium text-white hover:bg-gray-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 sm:px-4" aria-label="Add Application">
            <i class="fa-solid fa-plus text-xs"></i>
            <span class="kanban-add-label">Add Application</span>
          </button>
          <button id="btnMenu" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-lg hover:bg-gray-100 text-xl" aria-label="More options">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
        </div>
      
        <!-- DROPDOWN -->
        <div id="navDropdown" class="hidden absolute right-0 mt-1 w-48 bg-white border rounded-md shadow text-sm overflow-hidden">
          <button id="btnCustomizeFields" type="button" class="flex w-full items-center gap-2 px-4 py-2 text-left hover:bg-gray-100">
            <i class="fa-solid fa-sliders w-4 text-gray-500"></i>
            <span>Customize Fields</span>
          </button>
          <button id="btnDashboard" type="button" class="flex w-full items-center gap-2 px-4 py-2 text-left hover:bg-gray-100">
            <i class="fa-solid fa-chart-simple w-4 text-gray-500"></i>
            <span>Dashboard</span>
          </button>
          <button id="btnImport" type="button" class="flex w-full items-center gap-2 px-4 py-2 text-left hover:bg-gray-100">
            <i class="fa-solid fa-file-import w-4 text-gray-500"></i>
            <span>Import JSON</span>
          </button>
          <button id="btnExport" type="button" class="flex w-full items-center gap-2 px-4 py-2 text-left hover:bg-gray-100">
            <i class="fa-solid fa-file-export w-4 text-gray-500"></i>
            <span>Export JSON</span>
          </button>
        </div>
      </div>
    </header>
    
    <main class="board-workspace min-w-0 py-3 sm:py-4" id="boardContainer">
      <div id="kanbanView" class="kanban-view min-w-0">
        <div id="kanbanColumns" class="kanban-scroll-area flex min-w-0 gap-4 overflow-x-auto pb-3"></div>
      </div>

      <div id="listView" class="hidden min-w-0">
        <div id="listCards" class="list-view-cards grid min-w-0 gap-3"></div>
      </div>

      <p id="noSearchResults" class="hidden text-gray-400 text-center py-6">
        No matching jobs found.
      </p>
    </main>
  </div>

  <div id="dashboardModal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/50 p-3 sm:p-6">
    <div class="mx-auto my-4 max-h-[calc(100vh-2rem)] w-full max-w-2xl overflow-y-auto rounded-2xl bg-white p-4 sm:my-8 sm:max-h-[calc(100vh-4rem)] sm:p-6">
      <div class="mb-4">
        <div class="flex items-start justify-between gap-5 sm:items-center">
          <!-- Left side -->
          <h2 class="shrink-0 text-xl font-semibold">Dashboard</h2>

          <!-- Right side: filters + X -->
          <div class="flex min-w-0 flex-1 items-center justify-end gap-3">
            <select
              id="dashboardSelectColumn"
              class="h-8 min-w-0 w-full max-w-[11rem] rounded-lg border border-gray-200 bg-white px-3 text-sm outline-none"
              aria-label="Group by"
            ></select>
            <select
              id="dashboardRangeSelect"
              class="h-8 min-w-0 w-full max-w-[11rem] rounded-lg border border-gray-200 bg-white px-3 text-sm outline-none"
              aria-label="Range"
            >
              <option value="this-week">This Week</option>
              <option value="this-month" selected>This Month</option>
              <option value="last-month">Last Month</option>
              <option value="this-year">This Year</option>
              <option value="all-time">All Time</option>
              <option value="custom">Custom</option>
            </select>

            <button id="btnCloseDashboard" type="button" class="shrink-0 text-gray-500 text-xl hover:text-black">
              &times;
            </button>
          </div>
        </div>

        <div id="dashboardCustomRange" class="mt-3 hidden flex w-full flex-col gap-3 sm:flex-row ">
          <label class="flex items-center gap-2 text-sm text-gray-500 w-full">
            <span>From:</span>
            <input
              id="dashboardDateFrom"
              type="date"
              value="2026-07-01"
              class="h-8 rounded-lg w-full border border-gray-200 bg-white px-3 text-sm outline-none focus:ring-2 focus:ring-gray-200"
            />
          </label>
          <label class="flex items-center gap-2 text-sm text-gray-500 w-full">
            <span>To:</span>
            <input
              id="dashboardDateTo"
              type="date"
              value="2026-07-31"
              class="h-8 rounded-lg w-full border border-gray-200 bg-white px-3 text-sm outline-none focus:ring-2 focus:ring-gray-200"
            />
          </label>
        </div>
      </div>

      <div id="dashboardCards" class="grid grid-cols-1 gap-3 lg:grid-cols-3"></div>
      <div id="dashboardCharts"></div>
    </div>
  </div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
