<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (() => {
      const themeKey = 'jubro_theme';
      let theme = 'dark';

      try {
        const savedTheme = localStorage.getItem(themeKey);
        theme = savedTheme === 'light' ? 'light' : 'dark';

        if (!savedTheme) {
          localStorage.setItem(themeKey, theme);
        }
      } catch (error) {
        theme = 'dark';
      }

      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jubro Board - Job Application Workspace</title>
  <meta
    name="description"
    content="Jubro board workspace for managing a selected job application tracker."
  />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://jubro.vercel.app/board" />
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="icon" type="image/png" href="/img/jubro.png" />
</head>
<body id="appBody" class="bg-gray-100 text-gray-800 flex min-h-screen justify-center overflow-x-hidden">
  <h1 class="sr-only">Jubro Job Application Board</h1>
  <div class="w-full min-w-0 max-w-[1600px] mx-auto px-3 sm:px-6 lg:px-10">
    <header id="appNavbar" class="relative grid grid-cols-[minmax(0,1fr)_auto] items-center gap-2 p-3 bg-white shadow-sm sticky top-0 z-10 rounded-md sm:p-4 lg:grid-cols-[minmax(0,1fr)_minmax(20rem,32rem)_minmax(0,1fr)] lg:gap-4">
      <div class="flex min-w-0 items-center gap-2">
        <a href="/trackers" class="shrink-0 text-gray-600" aria-label="Back to home">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <input
          id="trackerTitleInput"
          type="text"
          class="min-w-0 flex-1 truncate text-lg font-semibold bg-transparent border-b border-transparent focus:border-gray-300 outline-none"
          aria-label="Tracker title"
        />
      </div>
      <div
        id="searchWrapper"
        class="relative hidden w-full min-w-0 gap-2 overflow-x-auto max-lg:absolute max-lg:inset-0 max-lg:z-20 max-lg:items-center max-lg:bg-white max-lg:p-3 lg:flex"
      >
        <!-- SEARCH -->
        <div
          id="searchInputWrapper"
          class="relative min-w-[12rem] flex-1"
        >
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm text-gray-400"></i>

          <input
            id="jobSearchInput"
            type="text"
            placeholder="Search jobs..."
            class="h-10 w-full rounded-full bg-gray-100 py-2 pl-10 pr-11 text-sm outline-none focus:bg-gray-50"
          />
        </div>

        <!-- SORT -->
        <div class="relative shrink-0">
          <i
            class="fa-solid fa-arrow-down-wide-short pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-400"
          ></i>

          <select
            id="tableSortSelect"
            class="cursor-pointer h-10 w-[86px] appearance-none rounded-full bg-gray-100 pl-8 pr-7 text-sm text-gray-700 outline-none transition focus:bg-gray-50 sm:w-[90px]"
            aria-label="Sort table by date"
          >
            <option value="date-desc">New</option>
            <option value="date-asc">Old</option>
            <option value="select-text">Select</option>
          </select>

          <i
            class="fa-solid fa-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-400"
          ></i>
        </div>

        <!-- TEXT FILTER -->
        <div id="selectTextSortWrapper" class="relative hidden shrink-0">
          <select
            id="selectTextSortSelect"
            class="cursor-pointer h-10 w-[92px] appearance-none rounded-full bg-gray-100 px-3 pr-7 text-sm text-gray-700 outline-none transition focus:bg-gray-50 sm:w-[95px]"
            aria-label="Select text column"
          ></select>

          <i
            class="fa-solid fa-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-400"
          ></i>
        </div>

        <!-- VALUE FILTER -->
        <div id="selectValueFilterWrapper" class="relative hidden shrink-0">
          <select
            id="selectValueFilterSelect"
            class="cursor-pointer h-10 w-[92px] appearance-none rounded-full bg-gray-100 px-3 pr-7 text-sm text-gray-700 outline-none transition focus:bg-gray-50 sm:w-[95px]"
            aria-label="Select option value"
          ></select>

          <i
            class="fa-solid fa-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-400"
          ></i>
        </div>

        <!-- CLOSE -->
        <button
          id="btnCloseSearch"
          type="button"
          class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200"
          aria-label="Close search"
        >
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <div class="relative justify-self-end">
        <div class="flex items-center justify-center gap-1 sm:gap-2">
          <button id="btnOpenSearch" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-lg hover:bg-gray-100 text-gray-700 lg:hidden" aria-label="Open search">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <select id="boardViewSelect" class="hidden" aria-label="Board view" tabindex="-1">
            <option value="table">Table</option>
            <option value="list">List view</option>
          </select>
          <div id="boardViewToggle" class="inline-flex shrink-0 items-center gap-1 rounded-lg border border-gray-200 bg-gray-100 p-1" role="group" aria-label="Board view">
            <button type="button" class="board-view-button inline-flex h-8 w-8 items-center justify-center rounded-md text-sm text-gray-600 transition hover:bg-white hover:text-gray-950 sm:h-9 sm:w-9" data-board-view-button="table" aria-label="Table view" aria-pressed="true">
              <i class="fa-solid fa-table-cells-large"></i>
            </button>
            <button type="button" class="board-view-button inline-flex h-8 w-8 items-center justify-center rounded-md text-sm text-gray-600 transition hover:bg-white hover:text-gray-950 sm:h-9 sm:w-9" data-board-view-button="list" aria-label="List view" aria-pressed="false">
              <i class="fa-solid fa-list-ul"></i>
            </button>
          </div>
          <button id="btnDashboard" type="button" class="ml-1 inline-flex h-10 w-10 items-center justify-center bg-black text-white rounded-lg text-sm hover:bg-gray-800 sm:ml-2" aria-label="Dashboard">
            <i class="fa-solid fa-chart-simple"></i>
          </button>
          <button id="btnMenu" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-lg hover:bg-gray-100 text-xl" aria-label="More options">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
        </div>
      
        <!-- DROPDOWN -->
        <div id="navDropdown" class="hidden absolute right-0 mt-1 w-40 bg-white border rounded-md shadow text-sm overflow-hidden">
          <button id="btnImport" type="button" class="flex w-full items-center gap-2 px-4 py-2 text-left hover:bg-gray-100">
            <i class="fa-solid fa-file-import w-4 text-gray-500"></i>
            <span>Import JSON</span>
          </button>
          <button id="btnExport" type="button" class="flex w-full items-center gap-2 px-4 py-2 text-left hover:bg-gray-100">
            <i class="fa-solid fa-file-export w-4 text-gray-500"></i>
            <span>Export JSON</span>
          </button>
          <div class="border-t border-gray-100"></div>
          <button id="btnExportExcel" type="button" class="flex w-full items-center gap-2 px-4 py-2 text-left hover:bg-gray-100">
            <i class="fa-solid fa-file-excel w-4 text-gray-500"></i>
            <span>Export Excel</span>
          </button>
        </div>
      </div>
    </header>
    
    <main class="min-w-0 py-3 sm:py-4" id="tableContainer">
      <div id="tableView" class="bg-white rounded-md shadow overflow-x-auto">
        <table class="min-w-max w-full text-sm text-center" id="table">
          <thead class="bg-gray-50 dark:bg-[#374151] sticky top-0">
            <tr id="headerRow"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div id="listView" class="hidden grid grid-cols-1 gap-4 lg:grid-cols-[18rem_minmax(0,1fr)]">
        <aside class="list-panel rounded-md bg-white p-4 shadow">
          <div class="rounded-md border border-gray-100 p-4">
            <p class="text-xs font-medium uppercase text-gray-400">Stats</p>
            <div class="mt-3 grid grid-cols-2 gap-3">
              <div>
                <p id="listThisMonthCount" class="text-2xl font-semibold text-gray-900">0</p>
                <p class="text-xs text-gray-500">This Month</p>
              </div>
              <div>
                <p id="listTotalCount" class="text-2xl font-semibold text-gray-900">0</p>
                <p class="text-xs text-gray-500">Total Jobs</p>
              </div>
            </div>
          </div>

          <div class="mt-4">
            <label for="listSearchInput" class="sr-only">Search list jobs</label>
            <div class="relative">
              <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-400"></i>
              <input
                id="listSearchInput"
                type="text"
                placeholder="Search list..."
                class="h-10 w-full rounded-lg border border-gray-100 bg-gray-50 py-2 pl-9 pr-3 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-gray-100"
              />
            </div>
          </div>

          <div id="listFilterSections" class="mt-5 space-y-5"></div>
        </aside>

        <section class="min-w-0">
          <div class="list-panel mb-4 flex flex-col gap-3 rounded-md bg-white p-3 shadow sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h2 class="text-base font-semibold text-gray-900">Applications</h2>
              <p class="text-sm text-gray-500">List view</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <select
                id="listSortSelect"
                class="h-10 rounded-lg border border-gray-100 bg-gray-50 px-3 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-gray-100"
                aria-label="Sort list jobs"
              >
                <option value="date-desc">Newest</option>
                <option value="date-asc">Oldest</option>
                <option value="manual">Manual</option>
              </select>
              <button
                id="btnListAddJob"
                type="button"
                class="inline-flex h-10 items-center gap-2 rounded-lg bg-black px-4 text-sm font-medium text-white hover:bg-gray-800"
              >
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Add Job</span>
              </button>
            </div>
          </div>

          <div id="listCards" class="space-y-3"></div>
        </section>
      </div>

      <p id="noSearchResults" class="hidden text-gray-400 text-center py-6">
        No matching jobs found.
      </p>

      <div id="boardPagination" class="mt-4 hidden items-center justify-center gap-3">
        <button
          id="btnPaginationPrev"
          type="button"
          class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40"
          aria-label="Previous page"
        >
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <span id="paginationLabel" class="text-sm text-gray-500">Page 1 of 1</span>
        <button
          id="btnPaginationNext"
          type="button"
          class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40"
          aria-label="Next page"
        >
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>
    </main>
  </div>

  <div id="dashboardModal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/50 p-3 sm:p-6">
    <div class="mx-auto my-4 max-h-[calc(100vh-2rem)] w-full max-w-2xl overflow-y-auto rounded-2xl bg-white p-4 sm:my-8 sm:max-h-[calc(100vh-4rem)] sm:p-6">
      <div class="mb-4 flex items-start justify-between gap-3 sm:items-center">
        <div class="flex min-w-0 flex-1 flex-col gap-2 sm:flex-row sm:items-center sm:gap-3">
          <h2 class="shrink-0 text-xl font-semibold">Dashboard</h2>
          <select
            id="dashboardSelectColumn"
            class="h-8 min-w-0 flex-1 rounded-lg border border-gray-200 bg-white px-3 text-sm outline-none focus:ring-2 focus:ring-gray-200"
            aria-label="Dashboard select column"
          ></select>
        </div>
        <button id="btnCloseDashboard" type="button" class="text-gray-500 text-xl hover:text-black">
          &times;
        </button>
      </div>

      <div id="dashboardCards" class="grid grid-cols-1 gap-3 lg:grid-cols-3"></div>
      <div id="dashboardCharts"></div>
    </div>
  </div>
  
  <div id="contextMenu" class="hidden fixed z-50 bg-white border rounded-lg shadow w-48 text-sm">
    <div class="relative group">
      <button id="btn-customize" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
        Customize ▶
      </button>
    
      <!-- SUBMENU -->
      <div id="subMenu"
        class="hidden absolute left-full top-0 ml-1 w-40 bg-white border rounded-md shadow text-sm overflow-hidden">
        
        <button id="btn-type-text" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Text
        </button>
        <button id="btn-type-checkbox" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Checkbox
        </button>
        <button id="btn-type-date" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Date
        </button>
        <button id="btn-type-select" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
          Select
        </button>
    
      </div>
    </div>
    <button id="btn-addRow" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Add Row</button>
    <button id="btn-addCol" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Add Column</button>
    <button id="btn-copyRow" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
      Copy Row
    </button>
    
    <button id="btn-copyCol" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">
      Copy Column
    </button>
    <button id="btn-moveUp" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Up</button>
    <button id="btn-moveDown" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Down</button>
    <button id="btn-moveLeft" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Left</button>
    <button id="btn-moveRight" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100">Move Right</button>
    <button id="btn-delRow" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100 text-red-500">Delete Row</button>
    <button id="btn-delCol" type="button" class="w-full text-left px-4 py-2 hover:bg-gray-100 text-red-500">Delete Column</button>
  </div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
